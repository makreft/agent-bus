[package]
name = "agent-bus"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Local message bus that lets AI coding agents in different tools reach and wake each other"
license = "MIT"
repository = "https://github.com/makreft/agent-bus"
publish = false

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
redb = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
toml = "1"
ureq = { version = "3", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3"
